name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'PyYAML>=6,<7'
      - run: python tests/run_offline.py
      - run: node --check desktop/plugin.js
      - run: |
          node --experimental-vm-modules tests/test_desktop.mjs
